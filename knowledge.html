<!doctype html><html lang="zh-CN"><head>
<script src="demo-shim.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>综合知识库</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#203246;background:#f3f6f8;margin:0}main{max-width:1050px;margin:34px auto;padding:0 18px}h1{font-size:28px}h2{font-size:19px;margin-top:0}.card{background:white;border:1px solid #dce4eb;border-radius:12px;padding:22px;margin:18px 0;box-shadow:0 4px 16px #2032460a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid label{display:flex;flex-direction:column;gap:5px}.wide{grid-column:1/-1}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #aebdca;border-radius:6px}textarea{min-height:130px;resize:vertical}button{background:#164e79;color:white;border:0;cursor:pointer;margin:4px}button:disabled{background:#9eabb7;cursor:not-allowed}.secondary{background:#e8eef4;color:#203246}.search{display:flex;gap:8px}.search input{flex:1}table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid #e3e9ee;padding:9px;text-align:left;vertical-align:top}th{background:#eef3f7}#review,#aiResult{display:none}#message{white-space:pre-wrap;color:#9a2d2d}small{color:#687989}a{color:#164e79}.ai-card{border-left:4px solid #6b63a9;background:linear-gradient(135deg,#fff,#f7f5ff)}.model-status{display:inline-block;border-radius:999px;background:#ebe8f8;color:#514a87;padding:5px 10px;font-size:12px}.consent{display:flex;align-items:flex-start;gap:8px;background:#fff8e8;border:1px solid #efd9a8;border-radius:8px;padding:11px;margin:12px 0}.consent input{margin-top:3px}#aiAnswer{width:calc(100% - 20px);min-height:240px;background:#fff}.source-list{background:#f5f8fa;border-radius:8px;padding:12px;margin-top:10px}@media(max-width:720px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.search{display:block}.search input{width:100%}}

.req{color:#c0392b;font-weight:700}
.opt{background:#eef3f7;color:#5b6b78;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:400}
.field-guide{background:#eef6fb;border-left:3px solid #2e789e;padding:9px 12px;border-radius:0 6px 6px 0;font-size:13px;line-height:1.6;margin:8px 0 12px}
</style></head><body><main><p><a href="workbench.html">← 返回统一工作台</a></p><h1>综合知识库</h1><p>只检索人工确认归档且当前服务角色有权访问的版本。更新生成新版本，不覆盖历史内容。</p><div class="card"><h2>检索</h2><div class="search"><input id="query" placeholder="输入制度、模板或案例关键词"><button onclick="searchEntries()">检索</button><button class="secondary" onclick="loadEntries()">查看全部</button></div><div id="results"></div></div>
<div class="card ai-card"><h2>AI 辅助：基于知识库回答</h2><p><span class="model-status" id="aiStatus">正在检查集团模型配置……</span> <button class="secondary" id="aiTestButton" onclick="testAiConnection()" disabled>测试当前连接</button></p><p><small>连接测试只发送固定的公开虚构短句，不发送知识库内容。正式调用会先在本地按当前服务角色检索，只将最多4条“内部”级且已确认的知识及问题发送至集团模型；“部门受限”和“严格受限”条目不会发送。回答必须标注【知识N】；没有可发送依据时不会调用模型。</small></p><label class="consent"><input id="aiConsent" type="checkbox"><span>我已检查问题，确认问题和筛选后的内部知识可发送至集团大模型。</span></label><button id="aiAnswerButton" onclick="answerWithAi()" disabled>检索并生成有依据回答</button><div id="aiResult"><p><small id="aiMeta"></small></p><textarea id="aiAnswer" aria-label="AI 知识库回答"></textarea><div class="source-list" id="aiSources"></div></div></div>
<div class="card"><h2>新增或更新知识条目</h2><p class="field-guide">带 <span class="req">*</span> 的必填；<b>来源或制度依据</b>建议填写，便于日后追溯，但不填也能保存。</p><input id="entryId" type="hidden"><div class="grid"><label>标题 <span class="req">*</span><input id="title"></label><label>类别 <span class="req">*</span><input id="category" placeholder="制度、模板、历史案例等"></label><label>访问级别 <span class="req">*</span><select id="access"><option value="internal">内部</option></select></label><label>来源或制度依据 <span class="opt">可选</span><input id="source" placeholder="文件名、制度编号或受控路径"></label><label class="wide">知识内容 <span class="req">*</span><textarea id="content"></textarea></label></div><button onclick="previewEntry()">预览归档</button><button class="secondary" onclick="clearForm()">清空</button></div>
<div class="card" id="review"><h2>人工确认</h2><div id="reviewContent"></div><button onclick="confirmEntry()">确认归档新版本</button><button class="secondary" onclick="cancelReview()">返回修改</button></div><p id="message"></p></main><script>
const $=id=>document.getElementById(id);let pending=null,role='internal';function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,body){let r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let d=await r.json();if(!r.ok)throw Error(d.error||'操作失败');return d}function msg(s){$('message').textContent=s}function render(rows){$('results').innerHTML=rows.length?`<table><thead><tr><th>标题</th><th>类别</th><th>版本</th><th>访问级别</th><th>来源</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.category)}</td><td>v${x.revision}</td><td>${esc(x.access_level)}</td><td>${esc(x.source_ref||'待补充')}</td><td><button class="secondary" onclick="editEntry('${x.id}')">查看或更新</button></td></tr>`).join('')}</tbody></table>`:'<p><small>暂无当前权限可访问的已确认条目。</small></p>'}async function setup(){let d=await api('/api/dashboard');role=d.knowledge_role;let levels=['internal'];if(role==='department'||role==='restricted')levels.push('department');if(role==='restricted')levels.push('restricted');$('access').innerHTML=levels.map(x=>`<option value="${x}">${x==='internal'?'内部':x==='department'?'部门受限':'严格受限'}</option>`).join('');await loadAiStatus();await loadEntries()}async function loadEntries(){try{render(await api('/api/knowledge/entries'))}catch(e){msg(e.message)}}async function searchEntries(){try{render((await api('/api/knowledge/search',{query:$('query').value})).results)}catch(e){msg(e.message)}}async function loadAiStatus(){try{let d=await api('/api/ai/status');$('aiStatus').textContent=d.configured?`已配置 · ${d.model}`:`未配置 SEI_API_KEY · 预设模型 ${d.model}`;$('aiAnswerButton').disabled=!d.configured}catch(e){$('aiStatus').textContent=e.message;$('aiAnswerButton').disabled=true}}async function answerWithAi(){if(!$('aiConsent').checked)return msg('请先确认问题和权限内检索结果可发送至集团大模型');$('aiAnswerButton').disabled=true;msg('正在检索权限内知识并生成回答……');try{let d=await api('/api/ai/knowledge-answer',{confirmed_for_model:true,query:$('query').value});$('aiAnswer').value=d.answer;$('aiMeta').textContent=`模型：${d.model} · 使用知识：${d.knowledge_count} 条 · Token：${d.usage.total_tokens??'未返回'}`;$('aiSources').innerHTML='<strong>引用来源</strong><br>'+d.sources.map(x=>`【知识${x.knowledge_no}】${esc(x.title)} · v${x.revision} · ${esc(x.source_ref||'来源待补充')}`).join('<br>');$('aiResult').style.display='block';$('aiResult').scrollIntoView({behavior:'smooth'});msg(d.message)}catch(e){msg(e.message)}finally{await loadAiStatus()}}async function editEntry(id){try{let d=await api('/api/knowledge/entry/'+id);$('entryId').value=d.entry.id;$('title').value=d.entry.title;$('category').value=d.entry.category;$('access').value=d.entry.access_level;$('source').value=d.version.source_ref||'';$('content').value=d.version.content;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}catch(e){msg(e.message)}}function clearForm(){$('entryId').value='';$('title').value='';$('category').value='';$('source').value='';$('content').value='';$('access').value='internal'}function collect(){return{id:$('entryId').value,title:$('title').value.trim(),category:$('category').value.trim(),access_level:$('access').value,source_ref:$('source').value.trim(),content:$('content').value.trim()}}async function previewEntry(){try{let payload=collect(),d=await api('/api/knowledge/preview',{payload});pending={payload,revision:d.revision,token:d.token};$('reviewContent').innerHTML=`<p><strong>${esc(d.payload.title)}</strong> · 将保存为 v${d.revision+1}</p><p>${d.findings.map(x=>'提醒：'+esc(x.message)).join('<br>')||'未发现缺项'}</p><p><small>${esc(d.next)}</small></p>`;$('review').style.display='block';$('review').scrollIntoView({behavior:'smooth'})}catch(e){msg(e.message)}}async function confirmEntry(){if(!pending)return;try{let d=await api('/api/knowledge/commit',pending);pending=null;$('review').style.display='none';clearForm();await loadEntries();msg(d.message)}catch(e){msg(e.message)}}function cancelReview(){pending=null;$('review').style.display='none';msg('已返回修改，原知识库未变化')}setup().catch(e=>msg(e.message));
async function api(path,body){let r;try{r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined})}catch(e){throw Error('本机服务未连接，请重新启动综智助手后刷新页面')}let raw=await r.text(),d={};if(raw){try{d=JSON.parse(raw)}catch(e){throw Error('后台返回内容不完整，请刷新后重试')}}if(!r.ok)throw Error(d.error||'操作失败');return d}
async function loadAiStatus(){try{let d=await api('/api/ai/status');$('aiStatus').textContent=d.configured?`已配置，尚未测试当前连接 · ${d.model}`:`未配置 SEI_API_KEY · 预设模型 ${d.model}`;$('aiAnswerButton').disabled=!d.configured;$('aiTestButton').disabled=!d.configured}catch(e){$('aiStatus').textContent=e.message;$('aiAnswerButton').disabled=true;$('aiTestButton').disabled=true}}
async function testAiConnection(){$('aiTestButton').disabled=true;$('aiStatus').textContent='正在测试当前连接……';try{let d=await api('/api/ai/test-connection',{});$('aiStatus').textContent=`连接成功 · ${d.model}`;msg(d.message)}catch(e){$('aiStatus').textContent=`当前连接不可用 · ${e.message}`;msg(e.message)}finally{$('aiTestButton').disabled=false}}
</script></body></html>
